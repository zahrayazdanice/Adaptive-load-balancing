<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Balancing Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header>
    <h1>Load Balancing Lab</h1>
    <p class="lede">Six load-balancing algorithms route the same simulated traffic across a cluster of
      12 servers. Pick a scenario and compare them.</p>
  </header>

  <nav class="seg" id="scenarios" aria-label="Scenario"></nav>
  <p class="about" id="about"></p>

  <section class="card">
    <div class="card-head">
      <h2 id="bars-title">Response time</h2>
      <div class="seg small" id="metrics" aria-label="Metric"></div>
    </div>
    <p class="hint" id="bars-hint"></p>
    <div class="chart" id="bars"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Over time</h2>
      <div class="seg small" id="views" aria-label="Series"></div>
    </div>
    <p class="hint" id="line-hint"></p>
    <div class="legend" id="legend"></div>
    <div class="chart" id="line"></div>
  </section>

  <section class="card">
    <h2>All numbers</h2>
    <div class="table-wrap"><table id="table"></table></div>
    <p class="hint" id="table-hint"></p>
  </section>

  <section class="card">
    <h2>The six algorithms</h2>
    <dl class="algos" id="algos"></dl>
  </section>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
