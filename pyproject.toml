[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lbsim"
version = "1.0.0"
description = "Discrete-event simulation study of adaptive load-balancing policies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbformat>=5.0", "nbclient>=0.7", "ipykernel"]

[project.scripts]
lbsim = "lbsim.__main__:main"

[tool.setuptools]
packages = ["lbsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
